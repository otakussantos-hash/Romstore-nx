name: Compilar NRO

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar bibliotecas do Switch
        run: |
          dkp-pacman -Sy --noconfirm --needed switch-dev switch-sdl2 switch-sdl2_image switch-sdl2_ttf switch-curl switch-zlib

      - name: Baixar biblioteca JSON
        run: |
          mkdir -p include
          curl -L -o include/json.hpp https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp

      - name: Compilar
        run: make

      - name: Guardar o NRO
        uses: actions/upload-artifact@v4
        with:
          name: romstore-nro
          path: romstore.nro
