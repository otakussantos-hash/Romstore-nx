name: Compilar ROM Store

# Arquivo unico: contem o codigo do app e compila o romstore.nro sozinho.
# O catalogo (catalogo.json) e lido deste mesmo repositorio.

on:
  push:
    paths-ignore:
      - 'catalogo.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Instalar bibliotecas do Switch
        run: dkp-pacman -Sy --noconfirm --needed switch-dev switch-sdl2 switch-sdl2_image switch-sdl2_ttf switch-curl switch-zlib

      - name: Criar o codigo do app
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p src include
          cat > src/main.cpp <<'ROMSTORE_EOF'
          // ROM Store - catalogo e downloader para Nintendo Switch (libnx + SDL2 + curl)
          #include <switch.h>
          #include <SDL2/SDL.h>
          #include <SDL2/SDL_image.h>
          #include <SDL2/SDL_ttf.h>
          #include <curl/curl.h>
          #include <sys/stat.h>
          #include <algorithm>
          #include <cstdio>
          #include <map>
          #include <string>
          #include <vector>
          #include "json.hpp"
          using json = nlohmann::json;

          // Endereco padrao do catalogo. Pode ser trocado sem recompilar em sdmc:/switch/romstore/config.ini
          // (conteudo do arquivo:  catalogo=https://seusite.com/catalogo.json)
          static const char* DEFAULT_URL = "https://SEUUSUARIO.github.io/SEUREPO/catalogo.json";
          static const char* CONFIG_PATH = "sdmc:/switch/romstore/config.ini";

          static const int W = 1280, H = 720, COLS = 3, PER = 6;
          static const SDL_Color BG = {24, 24, 30, 255}, WHITE = {255, 255, 255, 255}, GRAY = {170, 170, 182, 255},
                                 ORANGE = {255, 122, 0, 255}, ORANGE_L = {255, 170, 80, 255}, SEL = {0, 170, 255, 255},
                                 INK = {25, 25, 30, 255}, GREEN = {50, 170, 90, 255}, PH = {58, 58, 70, 255};

          static SDL_Renderer* ren;
          static TTF_Font *fS, *fM, *fL;

          struct Game {
              std::string id, titulo, sistema, descricao, capa, url, arquivo, tamanho;
              std::vector<std::string> fotos;
          };
          static std::vector<Game> games;
          static std::vector<std::string> cats;
          static std::vector<int> view;
          static std::string catSel, query, loadError;

          // ---------- utilidades ----------
          static std::string lower(std::string s) { for (auto& c : s) c = tolower((unsigned char)c); return s; }
          static bool safeName(const std::string& s) {
              return !s.empty() && s.find('/') == std::string::npos && s.find('\\') == std::string::npos && s.find("..") == std::string::npos;
          }
          static std::string destPath(const Game& g) { return "sdmc:/roms/" + lower(g.sistema) + "/" + g.arquivo; }
          static bool exists(const std::string& p) { struct stat st; return stat(p.c_str(), &st) == 0; }

          // ---------- rede ----------
          static void setup(CURL* c, const std::string& url) {
              curl_easy_setopt(c, CURLOPT_URL, url.c_str());
              curl_easy_setopt(c, CURLOPT_FOLLOWLOCATION, 1L);
              curl_easy_setopt(c, CURLOPT_SSL_VERIFYPEER, 0L);  // v1: sem certificado CA embutido
              curl_easy_setopt(c, CURLOPT_SSL_VERIFYHOST, 0L);
              curl_easy_setopt(c, CURLOPT_USERAGENT, "romstore/1.0");
              curl_easy_setopt(c, CURLOPT_CONNECTTIMEOUT, 15L);
          }
          static size_t wMem(char* p, size_t s, size_t n, void* u) { ((std::string*)u)->append(p, s * n); return s * n; }
          static size_t wFile(char* p, size_t s, size_t n, void* u) { return fwrite(p, s, n, (FILE*)u); }

          static bool fetch(const std::string& url, std::string& out) {
              CURL* c = curl_easy_init();
              if (!c) return false;
              setup(c, url);
              curl_easy_setopt(c, CURLOPT_WRITEFUNCTION, wMem);
              curl_easy_setopt(c, CURLOPT_WRITEDATA, &out);
              CURLcode r = curl_easy_perform(c);
              long code = 0;
              curl_easy_getinfo(c, CURLINFO_RESPONSE_CODE, &code);
              curl_easy_cleanup(c);
              return r == CURLE_OK && code >= 200 && code < 300;
          }

          // ---------- desenho ----------
          static void rect(int x, int y, int w, int h, SDL_Color c) {
              SDL_SetRenderDrawColor(ren, c.r, c.g, c.b, c.a);
              SDL_Rect r = {x, y, w, h};
              SDL_RenderFillRect(ren, &r);
          }
          static void text(TTF_Font* f, const std::string& s, int x, int y, SDL_Color c, int wrap = 0, bool center = false) {
              if (s.empty()) return;
              SDL_Surface* sf = wrap ? TTF_RenderUTF8_Blended_Wrapped(f, s.c_str(), c, wrap) : TTF_RenderUTF8_Blended(f, s.c_str(), c);
              if (!sf) return;
              SDL_Texture* t = SDL_CreateTextureFromSurface(ren, sf);
              SDL_Rect d = {center ? x - sf->w / 2 : x, y, sf->w, sf->h};
              SDL_RenderCopy(ren, t, nullptr, &d);
              SDL_DestroyTexture(t);
              SDL_FreeSurface(sf);
          }
          static std::string fit(TTF_Font* f, std::string s, int maxw) {  // corta texto com "..." (seguro p/ UTF-8)
              int w = 0, h = 0;
              TTF_SizeUTF8(f, s.c_str(), &w, &h);
              if (w <= maxw) return s;
              while (!s.empty()) {
                  while (!s.empty() && ((unsigned char)s.back() & 0xC0) == 0x80) s.pop_back();
                  if (!s.empty()) s.pop_back();
                  std::string t = s + "...";
                  TTF_SizeUTF8(f, t.c_str(), &w, &h);
                  if (w <= maxw) return t;
              }
              return "";
          }

          static std::map<std::string, SDL_Texture*> cache;
          static int loadBudget = 1;  // 1 imagem nova por quadro, para a tela nao travar
          static SDL_Texture* tex(const std::string& url) {
              if (url.empty()) return nullptr;
              auto it = cache.find(url);
              if (it != cache.end()) return it->second;
              if (loadBudget <= 0) return nullptr;
              loadBudget--;
              std::string data;
              SDL_Texture* t = nullptr;
              if (fetch(url, data)) {
                  SDL_Surface* s = IMG_Load_RW(SDL_RWFromConstMem(data.data(), (int)data.size()), 1);
                  if (s) { t = SDL_CreateTextureFromSurface(ren, s); SDL_FreeSurface(s); }
              }
              cache[url] = t;
              return t;
          }
          static void img(const std::string& url, int x, int y, int w, int h) {  // mantem a proporcao da imagem
              SDL_Texture* t = tex(url);
              rect(x, y, w, h, PH);
              if (!t) return;
              int tw = 0, th = 0;
              SDL_QueryTexture(t, nullptr, nullptr, &tw, &th);
              if (tw <= 0 || th <= 0) return;
              float sc = std::min((float)w / tw, (float)h / th);
              int dw = (int)(tw * sc), dh = (int)(th * sc);
              SDL_Rect d = {x + (w - dw) / 2, y + (h - dh) / 2, dw, dh};
              SDL_RenderCopy(ren, t, nullptr, &d);
          }

          // ---------- catalogo ----------
          static std::string catalogUrl() {
              if (FILE* f = fopen(CONFIG_PATH, "r")) {
                  char line[512];
                  while (fgets(line, sizeof line, f)) {
                      std::string s = line;
                      while (!s.empty() && (s.back() == '\n' || s.back() == '\r' || s.back() == ' ')) s.pop_back();
                      if (s.rfind("catalogo=", 0) == 0) { fclose(f); return s.substr(9); }
                  }
                  fclose(f);
              }
              return DEFAULT_URL;
          }
          static bool loadCatalog(const std::string& url) {
              std::string data;
              if (!fetch(url, data)) { loadError = "Não foi possível baixar o catálogo.\nConfira a internet e o endereço no config.ini"; return false; }
              json j = json::parse(data, nullptr, false);
              if (j.is_discarded() || !j.is_object()) { loadError = "Catálogo inválido (erro no JSON)"; return false; }
              auto S = [](const json& o, const char* k) { return o.contains(k) && o[k].is_string() ? o[k].get<std::string>() : std::string(); };
              if (j.contains("categorias") && j["categorias"].is_array())
                  for (auto& c : j["categorias"]) if (c.is_string()) cats.push_back(c.get<std::string>());
              if (j.contains("jogos") && j["jogos"].is_array())
                  for (auto& o : j["jogos"]) {
                      if (!o.is_object()) continue;
                      Game g;
                      g.id = S(o, "id"); g.titulo = S(o, "titulo"); g.sistema = S(o, "sistema"); g.descricao = S(o, "descricao");
                      g.capa = S(o, "capa"); g.url = S(o, "url"); g.arquivo = S(o, "arquivo"); g.tamanho = S(o, "tamanho");
                      if (o.contains("fotos") && o["fotos"].is_array())
                          for (auto& f : o["fotos"]) if (f.is_string()) g.fotos.push_back(f.get<std::string>());
                      games.push_back(g);
                  }
              return true;
          }
          static void refilter() {
              view.clear();
              std::string q = lower(query);
              for (size_t i = 0; i < games.size(); i++) {
                  if (!catSel.empty() && lower(games[i].sistema) != lower(catSel)) continue;
                  if (!q.empty() && lower(games[i].titulo).find(q) == std::string::npos) continue;
                  view.push_back((int)i);
              }
          }

          // ---------- download ----------
          static void drawProgress(const std::string& title, double pct, curl_off_t tot, curl_off_t now) {
              SDL_SetRenderDrawColor(ren, BG.r, BG.g, BG.b, 255);
              SDL_RenderClear(ren);
              text(fL, "Baixando...", W / 2, 200, WHITE, 0, true);
              text(fM, fit(fM, title, 1000), W / 2, 270, GRAY, 0, true);
              rect(240, 360, 800, 28, PH);
              if (pct >= 0) rect(240, 360, (int)(800 * pct), 28, ORANGE);
              char b[64];
              snprintf(b, sizeof b, "%.1f MB / %.1f MB", now / 1048576.0, tot / 1048576.0);
              text(fS, b, W / 2, 410, WHITE, 0, true);
              text(fS, "B: cancelar", W / 2, 620, GRAY, 0, true);
              SDL_RenderPresent(ren);
          }
          static int xfer(void* u, curl_off_t tot, curl_off_t now, curl_off_t, curl_off_t) {
              static Uint32 last = 0;
              bool cancel = false;
              SDL_Event e;
              while (SDL_PollEvent(&e)) if (e.type == SDL_JOYBUTTONDOWN && e.jbutton.button == 1) cancel = true;
              Uint32 t = SDL_GetTicks();
              if (t - last > 100) { last = t; drawProgress(*(std::string*)u, tot > 0 ? (double)now / tot : -1, tot, now); }
              return cancel ? 1 : 0;
          }
          static std::string downloadRom(const Game& g) {  // retorna "" se deu certo, ou a mensagem de erro
              if (!safeName(g.arquivo) || !safeName(g.sistema) || g.url.empty()) return "Dados do jogo inválidos no catálogo";
              mkdir("sdmc:/roms", 0777);
              mkdir(("sdmc:/roms/" + lower(g.sistema)).c_str(), 0777);
              std::string dst = destPath(g), tmp = dst + ".part", title = g.titulo;
              FILE* f = fopen(tmp.c_str(), "wb");
              if (!f) return "Não foi possível criar o arquivo no cartão SD";
              CURL* c = curl_easy_init();
              setup(c, g.url);
              curl_easy_setopt(c, CURLOPT_WRITEFUNCTION, wFile);
              curl_easy_setopt(c, CURLOPT_WRITEDATA, f);
              curl_easy_setopt(c, CURLOPT_FAILONERROR, 1L);
              curl_easy_setopt(c, CURLOPT_NOPROGRESS, 0L);
              curl_easy_setopt(c, CURLOPT_XFERINFOFUNCTION, xfer);
              curl_easy_setopt(c, CURLOPT_XFERINFODATA, &title);
              CURLcode r = curl_easy_perform(c);
              curl_easy_cleanup(c);
              fclose(f);
              if (r == CURLE_OK) { remove(dst.c_str()); rename(tmp.c_str(), dst.c_str()); return ""; }
              remove(tmp.c_str());
              return r == CURLE_ABORTED_BY_CALLBACK ? "Download cancelado" : std::string("Falha no download: ") + curl_easy_strerror(r);
          }

          static bool askText(std::string& out) {  // teclado nativo do Switch
              SwkbdConfig k;
              char buf[64] = {0};
              if (R_FAILED(swkbdCreate(&k, 0))) return false;
              swkbdConfigMakePresetDefault(&k);
              swkbdConfigSetGuideText(&k, "Buscar jogo");
              Result rc = swkbdShow(&k, buf, sizeof buf);
              swkbdClose(&k);
              if (R_FAILED(rc)) return false;
              out = buf;
              return true;
          }
          static std::vector<std::string> gallery(const Game& g) {
              std::vector<std::string> v;
              if (!g.capa.empty()) v.push_back(g.capa);
              for (auto& f : g.fotos) v.push_back(f);
              return v;
          }

          // ---------- telas ----------
          enum Scr { GRID, DETAIL };

          int main(int, char**) {
              socketInitializeDefault();
              plInitialize(PlServiceType_User);
              curl_global_init(CURL_GLOBAL_DEFAULT);
              SDL_Init(SDL_INIT_VIDEO | SDL_INIT_JOYSTICK);
              IMG_Init(IMG_INIT_JPG | IMG_INIT_PNG);
              TTF_Init();
              for (int i = 0; i < SDL_NumJoysticks(); i++) SDL_JoystickOpen(i);
              SDL_Window* win = SDL_CreateWindow("ROM Store", 0, 0, W, H, SDL_WINDOW_SHOWN);
              ren = SDL_CreateRenderer(win, -1, SDL_RENDERER_ACCELERATED | SDL_RENDERER_PRESENTVSYNC);
              PlFontData fd;
              plGetSharedFontByType(&fd, PlSharedFontType_Standard);
              fS = TTF_OpenFontRW(SDL_RWFromMem(fd.address, fd.size), 1, 22);
              fM = TTF_OpenFontRW(SDL_RWFromMem(fd.address, fd.size), 1, 28);
              fL = TTF_OpenFontRW(SDL_RWFromMem(fd.address, fd.size), 1, 42);

              SDL_SetRenderDrawColor(ren, BG.r, BG.g, BG.b, 255);
              SDL_RenderClear(ren);
              text(fM, "Carregando catálogo...", W / 2, 320, WHITE, 0, true);
              SDL_RenderPresent(ren);
              loadCatalog(catalogUrl());
              refilter();

              Scr scr = GRID;
              bool side = false, run = true;
              int sel = 0, sideSel = 0, thumb = 0;
              std::string msg;
              Uint32 msgUntil = 0;

              while (run && appletMainLoop()) {
                  loadBudget = 1;
                  SDL_Event e;
                  while (SDL_PollEvent(&e)) {
                      if (e.type == SDL_QUIT) run = false;
                      if (e.type != SDL_JOYBUTTONDOWN) continue;
                      int b = e.jbutton.button;  // 0 A, 1 B, 2 X, 3 Y, 6 L, 7 R, 10 +, 12 esq, 13 cima, 14 dir, 15 baixo
                      int n = (int)view.size();
                      if (b == 10) { run = false; }
                      else if (scr == GRID && side) {
                          int items = 2 + (int)cats.size();
                          if (b == 13 && sideSel > 0) sideSel--;
                          else if (b == 15 && sideSel < items - 1) sideSel++;
                          else if (b == 1 || b == 14 || b == 3) side = false;
                          else if (b == 0) {
                              if (sideSel == 0) {
                                  std::string t;
                                  if (askText(t)) { query = t; refilter(); sel = 0; side = false; }
                              } else {
                                  if (sideSel == 1) { catSel.clear(); query.clear(); }
                                  else catSel = cats[sideSel - 2];
                                  refilter(); sel = 0; side = false;
                              }
                          }
                      } else if (scr == GRID) {
                          if (b == 3) side = true;
                          else if (b == 12) { if (sel % COLS == 0) side = true; else sel--; }
                          else if (b == 14) { if (sel % COLS < COLS - 1 && sel + 1 < n) sel++; }
                          else if (b == 13) { if (sel - COLS >= 0) sel -= COLS; }
                          else if (b == 15) { if (sel + COLS < n) sel += COLS; }
                          else if (b == 6) sel = std::max(0, sel - PER);
                          else if (b == 7) sel = std::min(std::max(n - 1, 0), sel + PER);
                          else if (b == 0 && n > 0) { scr = DETAIL; thumb = 0; }
                      } else {
                          const Game& g = games[view[sel]];
                          int cnt = std::max(1, (int)gallery(g).size());
                          if (b == 1) scr = GRID;
                          else if (b == 12 || b == 6) thumb = (thumb + cnt - 1) % cnt;
                          else if (b == 14 || b == 7) thumb = (thumb + 1) % cnt;
                          else if (b == 0) {
                              std::string err = downloadRom(g);
                              msg = err.empty() ? "Salvo em " + destPath(g) : err;
                              msgUntil = SDL_GetTicks() + 7000;
                          }
                      }
                  }

                  SDL_SetRenderDrawColor(ren, BG.r, BG.g, BG.b, 255);
                  SDL_RenderClear(ren);
                  int n = (int)view.size();

                  if (scr == GRID) {
                      std::string head = catSel.empty() ? "Todos os jogos" : catSel;
                      if (!query.empty()) head += "  -  busca: " + query;
                      text(fM, fit(fM, head, 1100), 40, 32, WHITE);
                      if (n == 0) text(fM, games.empty() ? loadError : "Nenhum jogo encontrado", 40, 150, GRAY, 1100);
                      int page = sel / PER;
                      for (int k = 0; k < PER; k++) {
                          int i = page * PER + k;
                          if (i >= n) break;
                          const Game& g = games[view[i]];
                          int x = 40 + (k % COLS) * 410, y = 100 + (k / COLS) * 270;
                          if (i == sel && !side) rect(x - 5, y - 5, 390, 262, SEL);
                          rect(x, y, 380, 252, WHITE);
                          img(g.capa, x, y, 380, 214);
                          text(fS, fit(fS, g.titulo, 360), x + 10, y + 218, INK);
                      }
                      int pages = std::max(1, (n + PER - 1) / PER);
                      for (int p = 0; p < pages && p < 20; p++) rect(W / 2 - pages * 7 + p * 14, 652, 8, 8, p == page ? WHITE : GRAY);
                      text(fS, "Y: busca e categorias     A: abrir     L/R: página     +: sair", 40, 684, GRAY);
                      if (side) {
                          rect(0, 0, 320, H, ORANGE);
                          int items = 2 + (int)cats.size();
                          for (int i = 0; i < items; i++) {
                              int y = 90 + i * 56;
                              if (i == sideSel) rect(0, y - 8, 320, 52, ORANGE_L);
                              std::string label = i == 0 ? (query.empty() ? "Buscar" : "Buscar: " + query) : i == 1 ? "Todos" : cats[i - 2];
                              text(fM, fit(fM, label, 270), 30, y, WHITE);
                              if (i == 1) rect(30, y + 48, 260, 2, ORANGE_L);
                          }
                          text(fS, "A: escolher     B: fechar", 30, 684, WHITE);
                      }
                  } else if (n > 0) {
                
